
name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:    # Added manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: List build directory
      run: |
        echo "Contents of dist directory:"
        ls -la dist/
        echo "Contents of dist/assets directory:"
        ls -la dist/assets/
      
    - name: Deploy to Server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.1000feetabove.com
        username: u32707381@1000feetabove.com
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: dist/
        server-dir: /domains/1000feetabove.com/public_html/skilldirectory/
        port: 21
        dangerous-clean-slate: true
        protocol: ftp
        timeout: 60000
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
