
name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:    # Added manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: List build directory
      run: |
        echo "Contents of dist directory:"
        ls -la dist/
        echo "Contents of dist/assets directory:"
        ls -la dist/assets/
      
    - name: Deploy to Server
      uses: easingthemes/ssh-deploy@main
      env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: "167.88.41.22"
          REMOTE_USER: "u32707381"
          SOURCE: "dist/"
          TARGET: "/home/u32707381/domains/1000feetabove.com/public_html/skilldirectory/"
          EXCLUDE: "/dist/, /node_modules/, /.git/, /.github/"
          ARGS: "-rltgoDzvO --delete"
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=no"
          REMOTE_PORT: "65002"

