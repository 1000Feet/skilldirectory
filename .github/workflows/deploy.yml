
name: Deploy to Production

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Build
      run: npm run build
      
    - name: Setup Git Config
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "github-actions@github.com"
        
    - name: Deploy to Hostinger
      env:
        DEPLOY_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      run: |
        echo "$DEPLOY_KEY" > deploy_key
        chmod 600 deploy_key
        mkdir -p ~/.ssh
        cp deploy_key ~/.ssh/id_rsa
        ssh-keyscan -p 65002 167.88.41.22 >> ~/.ssh/known_hosts
        
        # Set up Git remote for Hostinger
        git remote add hostinger ssh://u32707381@167.88.41.22:65002/home/u32707381/domains/1000feetabove.com/public_html/skilldirectory
        
        # Push the dist directory to Hostinger
        git add dist -f
        git commit -m "Deploy build files"
        git push -u hostinger HEAD:main --force
